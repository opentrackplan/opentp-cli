opentp: 2026-09

info:
  title: Coverage Fixture (Invalid)
  version: 1.0.0
  description: Fixture intentionally containing schema and validation errors

spec:
  paths:
    events:
      root: /events
      template: "{area}/{priority_level}/{is_internal}/{event}.yaml"
    dictionaries:
      root: /dictionaries

  events:
    key:
      pattern: "^[a-z0-9_]+::[a-z0-9_]+::p[0-9]+::internal-(true|false)$"

    taxonomy:
      area:
        title: Area
        type: string
        dict: taxonomy/areas
        required: true
      priority_level:
        title: Priority Level
        type: integer
        enum: [1, 2, 3]
        required: true
      is_internal:
        title: Internal Event
        type: boolean
        enum: [true, false]
        required: true
      event:
        title: Event
        type: string
        required: true
      action:
        title: Action
        type: string
        required: true
        maxLength: 100
      action_detail:
        title: Action Detail
        type: string
        required: true
        template: "{verb}::{object}"
        fragments:
          verb:
            title: Verb
            type: string
            required: true
            # No such dictionary: reported once against opentp.yaml
            dict: taxonomy/verbs
          object:
            title: Object
            type: string
            required: true
      custom_id:
        title: Custom Id
        type: string
        required: false
        checks:
          # Not in spec.checks, not a rule, not bound: one unknownCheck warning against opentp.yaml
          unknown-check: true
      team:
        title: Team
        type: string
        required: false
        # No such dictionary: reported once against opentp.yaml
        dict: taxonomy/teams
      ticket:
        title: Ticket
        type: string
        required: false
        checks:
          # External check that throws (external-rules/throwing-check)
          throwing-check: true

    payload:
      targets:
        all: [web, ios, android]
        mobile: [ios, android]
        web_ios: [web, ios]
        # "desktop" is not in targets.all: reported once against opentp.yaml, and a payload
        # selector "legacy" covers no target
        legacy: [desktop]
      # Field catalog: the fields events may use
      schema:
        user_id:
          type: string
          required: false
          # Removed in 2026-09: reported once against opentp.yaml
          x-opentp:
            role: attribute
        # Portable check (spec.checks), format and a rule binding (opentp.cli.yaml), see
        # value_checks_fail.yaml
        ticket_id:
          type: string
          required: false
          checks:
            ticket-key: true
        user_email:
          type: string
          format: email
          required: false
        screen_name:
          type: string
          required: false
          checks:
            short-name: true
        # A dict override must narrow these (see payload_dict_override_not_subset.yaml)
        sign_in_method:
          type: string
          enum: [email, google]
          required: false
        owner_team:
          type: string
          dict: governance/pii-owners
          required: false
        tags:
          type: array
          items:
            type: string
            enum: [a, b, c]
        plan_tier:
          type: string
          enum: [free, pro, team]
          example: team
        dimension_1: &dim
          type: string
        dimension_2: *dim
        dimension_3: *dim
        dimension_10: *dim
        # Reported once against opentp.yaml: an enum member longer than maxLength, an example
        # outside the enum and too long
        country_code:
          type: string
          maxLength: 2
          enum: [US, DEU]
          example: FRA
        # No such dictionary: reported once against opentp.yaml
        region:
          type: string
          dict: geo/regions
        # An empty enum: reported once against opentp.yaml
        empty_choice:
          type: string
          enum: []
        # spec.targets.ios changes the type: reported once against opentp.yaml
        session_length:
          type: integer

    pii:
      kind:
        required: true
        dict: governance/pii-kinds
      masker:
        required: false
      schema:
        owner:
          type: string
          dict: governance/pii-owners
          required: true
        jira:
          type: string
          required: true
          pattern: "^[A-Z]+-[0-9]+$"

  checks:
    ticket-key:
      pattern: "^[A-Z]+-[0-9]+$"
    # No constraint keyword: reported once against opentp.yaml
    empty-check:
      title: Nothing to check
    # Same id as the built-in check: the plan definition wins, with one warning
    ends-with:
      maxLength: 40

  # Common fields: part of every event on a target
  targets:
    all:
      title: Every target
      schema:
        application_id:
          type: string
          dict: data/application_id
          required: true
          policy: fixed
          # Removed in 2026-09: reported once against opentp.yaml
          valueRequired: true
        event_name:
          type: string
          required: true
          policy: specified
        # The declaring layer (spec.targets.all) sets the enum: events must still restrict the
        # field, except on ios, whose layer restricts it after the declaring layer
        event_category:
          type: string
          enum: [auth, badarea]
          policy: restricted
        build_variant:
          type: string
          required: false
        # Same code-facing name as build_variant: reported once against opentp.yaml
        client_build:
          type: string
          name: build_variant
        schema_version:
          type: integer
          value: 2
        # A fixed value of the wrong type: reported once against opentp.yaml
        sdk_name:
          type: string
          value: 7
        # required: false next to a fixed value: reported once against opentp.yaml
        legacy_flag:
          type: boolean
          value: false
          required: false
    ios:
      title: iOS
      schema:
        event_category:
          enum: [auth, badarea]
        # A later layer cannot lower a policy: reported once against opentp.yaml
        application_id:
          policy: restricted
        # Not a subset of the catalog enum: reported once against opentp.yaml
        sign_in_method:
          enum: [email, apple]
        # Not the catalog type: reported once against opentp.yaml
        session_length:
          type: number
        # No type in any layer: reported once against opentp.yaml
        os_name: {}
    # "desktop" is not in spec.events.payload.targets.all: reported once against opentp.yaml
    desktop:
      title: Desktop
