opentp: 2026-09

event:
  key: auth::optional_constant_missing_value::p1::internal-false

  taxonomy:
    action: The event still writes x-opentp, which was removed in 2026-09
    action_detail: "test::payload"

  payload:
    schema:
      application_id:
        value: web-app
      event_name:
        value: optional_constant_missing_value
      event_category:
        value: auth
      build_variant:
        type: string
        # Implicit `all` covers web, ios and android, but the error is reported once per file
        x-opentp:
          role: constant
