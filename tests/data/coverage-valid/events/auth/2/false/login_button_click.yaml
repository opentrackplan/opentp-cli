opentp: 2026-09

event:
  key: auth::login_button_click::click::login_button::p2::internal-false

  lifecycle:
    status: active

  taxonomy:
    action: User clicks the login button
    action_detail: "click::login button"
    custom_id: cid_login_button
    release_date: 2026-09-01

  payload:
    schema:
      application_id:
        value: web-app
      event_name:
        value: login_button_click
      event_category:
        value: auth
      dimension_1:
        value: enterprise
      auth_method:
        value: google
      tags:
        value: [auth, login]
      # Listed without changes: every iOS event must list device_model (policy: specified)
      device_model: {}
      user_id:
        # A type written in an event must equal the inherited one
        type: string
        pii:
          kind: user_id
          masker: star
          owner: analytics
          jira: ANALYTICS-123
