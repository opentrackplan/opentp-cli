opentp: 2026-09

event:
  key: auth::login_experiment::experiment::login::p3::internal-false

  taxonomy:
    action: User sees a login experiment variant
    action_detail: "experiment::login"

  payload:
    web:
      schema:
        application_id:
          value: web-app
        event_name:
          value: login_experiment
        event_category:
          value: auth
        auth_method:
          value: github
        # The catalog example (team) is not in this enum, so it is dropped
        plan_tier:
          enum: [free, pro]
        # Type inheritance: the type comes from the catalog
        user_id: {}

    mobile:
      current: stable
      stable: "1.1.0"
      "1.0.0":
        schema:
          application_id:
            value: mobile-app
          event_name:
            value: login_experiment
          event_category:
            value: auth
          device_model:
            required: true
          auth_method:
            enum: [google, github]
      "1.1.0":
        $ref: "1.0.0"
        meta:
          changes: Added tags
        schema:
          tags:
            value: [experiment]
