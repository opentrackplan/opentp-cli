opentp: 2026-09

event:
  key: onboarding::onboarding_step_complete::complete::onboarding_step::p1::internal-true

  lifecycle:
    status: active

  taxonomy:
    action: User completes an onboarding step
    action_detail: "complete::onboarding step"

  payload:
    web:
      current: stable
      stable: "1.1.0"
      legacy: "1.0.0"
      "1.0.0":
        meta:
          changes: Initial version
          # Deprecated versions are exempt from policy: this one does not list event_category
          deprecated:
            reason: Superseded by 1.1.0
            date: "2026-01-15"
        schema:
          application_id:
            value: web-app
          event_name:
            value: onboarding_step_complete
          step_index:
            required: true
            example: 2
          # A dict override that narrows the catalog enum [email, google, github]
          auth_method:
            dict: data/social_auth_methods
      "1.1.0":
        $ref: "1.0.0"
        meta:
          changes:
            - Added event_category and device_model
        schema:
          event_category:
            value: onboarding
          device_model:
            required: false

    ios:
      current: ios-stable
      ios-stable: ios-1
      ios-1:
        $ref: "web::1.0.0"
        meta:
          changes: iOS overlay derived from web::1.0.0
        schema:
          application_id:
            value: mobile-app
          event_category:
            value: onboarding
          device_model:
            type: string
            required: true

    android:
      schema:
        application_id:
          value: mobile-app
        event_name:
          value: onboarding_step_complete
        event_category:
          value: onboarding
        step_index:
          required: true
        device_model:
          required: true
        # Item narrowing: the catalog allows any non-empty string
        tags:
          items:
            enum: [onboarding, activation]
