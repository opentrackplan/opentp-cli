opentp: 2026-09

info:
  title: Coverage Fixture (Valid)
  version: 1.0.0
  description: Fixture covering many spec features with zero validation errors

spec:
  paths:
    events:
      root: /events
      template: "{area}/{priority_level}/{is_internal}/{event}.yaml"
    dictionaries:
      root: /dictionaries

  events:
    key:
      minLength: 3
      maxLength: 160
      pattern: "^[a-z0-9_]+::[a-z0-9_]+::[a-z0-9_]+::[a-z0-9_]+::p[0-9]+::internal-(true|false)$"

    taxonomy:
      area:
        title: Area
        type: string
        dict: taxonomy/areas
        required: true
      priority_level:
        title: Priority Level
        type: integer
        enum: [1, 2, 3]
        required: true
      is_internal:
        title: Internal Event
        type: boolean
        enum: [true, false]
        required: true
      event:
        title: Event
        type: string
        required: true
      action:
        title: Action
        type: string
        required: true
        maxLength: 100
      action_detail:
        title: Action Detail
        type: string
        required: true
        template: "{verb}::{object}"
        fragments:
          verb:
            title: Verb
            type: string
            required: true
            pattern: "^[a-z]+$"
          object:
            title: Object
            type: string
            required: true
            pattern: "^[a-z ]+$"
      custom_id:
        title: Custom Id
        type: string
        required: false
        checks:
          starts-with: "cid_"
      release_date:
        title: Release Date
        type: string
        format: date
        required: false

    payload:
      targets:
        all: [web, ios, android]
        mobile: [ios, android]
      # Field catalog: the fields events may use (listing a field here does not add it to events)
      schema:
        dimension_1:
          type: string
          name: orgType
          title: Organization Type
          description: Logical organization type stored in analytics slot dimension_1
          enum: [startup, enterprise, agency]
          example: enterprise
        auth_method:
          type: string
          enum: [email, google, github]
        plan_tier:
          type: string
          enum: [free, pro, team]
          # Dropped silently where an event narrows the enum without it
          example: team
        user_id:
          type: string
        device_model:
          type: string
        step_index:
          type: number
        is_internal:
          type: boolean
        priority_level:
          type: number
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1

    pii:
      kind:
        required: true
        dict: governance/pii-kinds
      masker:
        required: false
      schema:
        owner:
          type: string
          dict: governance/pii-owners
          required: true
        jira:
          type: string
          required: true
          checks:
            # A portable check from spec.checks
            jira-key: true
        retention_days:
          type: integer
          enum: [0, 7, 30]
          required: false

  checks:
    jira-key:
      description: A ticket key such as ANALYTICS-123
      pattern: "^[A-Z]+-[0-9]+$"
      maxLength: 32

  # Common fields: part of every event on a target
  targets:
    all:
      title: Every target
      description: Fields that every event sends on every target
      schema:
        application_id:
          type: string
          dict: data/application_id
          policy: fixed
        event_name:
          type: string
          policy: fixed
          checks:
            # A rule binding from opentp.cli.yaml
            snake-case-name: true
        event_category:
          type: string
          policy: restricted
        build_variant:
          type: string
          required: false
    ios:
      title: iOS
      x-acme-team: mobile
      schema:
        # The type comes from the catalog; every iOS event must list it
        device_model:
          description: Model identifier reported by iOS
          policy: specified
